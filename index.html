<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>弹幕躲避</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0a;
            font-family: Arial, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        let W, H; // 画布逻辑尺寸
        let dpr = window.devicePixelRatio || 1;

        // ---- 高清适配：处理设备像素比 ----
        function resizeCanvas() {
            dpr = window.devicePixelRatio || 1;

            // 画布占满整个窗口
            W = window.innerWidth;
            H = window.innerHeight;

            // 设置画布物理像素尺寸（解决模糊）
            canvas.width = W * dpr;
            canvas.height = H * dpr;

            // 设置画布 CSS 显示尺寸（占满屏幕）
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';

            // 缩放绘图上下文，让所有绘制命令使用逻辑坐标
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ---- 游戏状态 ----
        const player = {
            x: 0,
            y: 0,
            size: 0
        };

        let enemies = [];
        let particles = [];
        let score = 0;
        let gameRunning = false;
        let gameOver = true;
        let bestScore = 0;

        try {
            bestScore = parseInt(localStorage.getItem('dodgeBestScore')) || 0;
        } catch(e) {
            bestScore = 0;
        }

        let mouseX = 0;
        let mouseY = 0;
        let pointerActive = false;

        let spawnTimer = 0;
        let spawnDelay = 30;
        let scoreTimer = 0;
        let shakeAmount = 0;

        // ---- 输入处理 ----
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else if (e.changedTouches && e.changedTouches.length > 0) {
                clientX = e.changedTouches[0].clientX;
                clientY = e.changedTouches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        canvas.addEventListener('mousemove', (e) => {
            const pos = getPos(e);
            mouseX = pos.x;
            mouseY = pos.y;
            pointerActive = true;
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const pos = getPos(e);
            mouseX = pos.x;
            mouseY = pos.y;
            pointerActive = true;
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            pointerActive = false;
        });

        canvas.addEventListener('touchcancel', () => {
            pointerActive = false;
        });

        canvas.addEventListener('mouseleave', () => {
            pointerActive = false;
        });

        function handleStart(e) {
            e.preventDefault();
            if (gameOver) {
                startGame();
            }
        }
        canvas.addEventListener('click', handleStart);
        canvas.addEventListener('touchstart', handleStart, { passive: false });

        // ---- 游戏逻辑 ----
        function startGame() {
            player.x = W / 2;
            player.y = H / 2;
            mouseX = W / 2;
            mouseY = H / 2;
            // 玩家大小基于屏幕尺寸
            player.size = Math.max(6, Math.min(W, H) * 0.015);
            enemies = [];
            particles = [];
            score = 0;
            spawnTimer = 0;
            spawnDelay = 28;
            scoreTimer = 0;
            shakeAmount = 0;
            gameRunning = true;
            gameOver = false;
        }

        function spawnEnemy() {
            const side = Math.floor(Math.random() * 4);
            let x, y;
            const margin = Math.min(W, H) * 0.04;
            if (side === 0)      { x = Math.random() * W; y = -margin; }
            else if (side === 1) { x = W + margin; y = Math.random() * H; }
            else if (side === 2) { x = Math.random() * W; y = H + margin; }
            else                 { x = -margin; y = Math.random() * H; }

            const dx = player.x - x + (Math.random() - 0.5) * Math.min(W, H) * 0.2;
            const dy = player.y - y + (Math.random() - 0.5) * Math.min(W, H) * 0.2;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const baseSpeed = Math.min(W, H) * 0.005;
            const speed = baseSpeed + Math.random() * baseSpeed * 1.5;

            enemies.push({
                x: x,
                y: y,
                vx: (dx / dist) * speed,
                vy: (dy / dist) * speed,
                size: Math.min(W, H) * 0.008 + Math.random() * Math.min(W, H) * 0.014,
                color: `hsl(${Math.random() * 360}, 75%, 55%)`
            });
        }

        function createParticles(x, y, count) {
            const baseSpeed = Math.min(W, H) * 0.003;
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = baseSpeed + Math.random() * baseSpeed * 3;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    size: Math.min(W, H) * 0.004 + Math.random() * Math.min(W, H) * 0.008
                });
            }
        }

        function update() {
            if (!gameRunning) return;

            // 平滑跟随指针
            if (pointerActive) {
                player.x += (mouseX - player.x) * 0.2;
                player.y += (mouseY - player.y) * 0.2;
            }

            const pad = player.size;
            player.x = Math.max(pad, Math.min(W - pad, player.x));
            player.y = Math.max(pad, Math.min(H - pad, player.y));

            // 生成敌人
            spawnTimer++;
            if (spawnTimer >= spawnDelay) {
                spawnTimer = 0;
                spawnEnemy();
                if (spawnDelay > 5) spawnDelay -= 0.25;
            }

            // 更新敌人
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.x += e.vx;
                e.y += e.vy;

                const margin = Math.max(W, H) * 0.15;
                if (e.x < -margin || e.x > W + margin || e.y < -margin || e.y > H + margin) {
                    enemies.splice(i, 1);
                    continue;
                }

                const dx = player.x - e.x;
                const dy = player.y - e.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < player.size + e.size) {
                    gameRunning = false;
                    gameOver = true;
                    shakeAmount = Math.min(W, H) * 0.025;
                    createParticles(player.x, player.y, 30);

                    const finalScore = Math.floor(score);
                    if (finalScore > bestScore) {
                        bestScore = finalScore;
                        try {
                            localStorage.setItem('dodgeBestScore', bestScore);
                        } catch(e) {}
                    }
                    return;
                }
            }

            scoreTimer++;
            if (scoreTimer >= 60) {
                scoreTimer = 0;
                score++;
            }

            // 粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.025;
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (shakeAmount > 0) {
                shakeAmount *= 0.87;
                if (shakeAmount < 0.05) shakeAmount = 0;
            }
        }

        function draw() {
            ctx.fillStyle = '#0d0d0d';
            ctx.fillRect(0, 0, W, H);

            // 网格
            const gridSize = Math.min(W, H) / 14;
            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = Math.max(0.5, dpr * 0.5);
            for (let x = gridSize; x < W; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, H);
                ctx.stroke();
            }
            for (let y = gridSize; y < H; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }

            let sx = 0, sy = 0;
            if (shakeAmount > 0) {
                sx = (Math.random() - 0.5) * shakeAmount * 2;
                sy = (Math.random() - 0.5) * shakeAmount * 2;
            }

            ctx.save();
            ctx.translate(sx, sy);

            // 敌人
            for (const e of enemies) {
                ctx.fillStyle = e.color;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
                ctx.fill();
                // 高光
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.beginPath();
                ctx.arc(e.x - e.size * 0.2, e.y - e.size * 0.2, e.size * 0.35, 0, Math.PI * 2);
                ctx.fill();
            }

            // 粒子
            for (const p of particles) {
                ctx.fillStyle = `rgba(255, 130, 60, ${p.life})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }

            // 玩家
            if (gameRunning) {
                const s = player.size;
                ctx.fillStyle = '#00ddff';
                ctx.shadowColor = '#00ddff';
                ctx.shadowBlur = s * 1.8;
                ctx.fillRect(player.x - s, player.y - s, s * 2, s * 2);
                // 内高光
                ctx.fillStyle = 'rgba(255,255,255,0.45)';
                ctx.fillRect(player.x - s * 0.5, player.y - s * 0.5, s, s);
                ctx.shadowBlur = 0;
            }

            ctx.restore();

            // UI
            const fontSize = Math.max(13, Math.min(W, H) * 0.045);
            const padding = Math.min(W, H) * 0.04;

            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${fontSize}px Arial`;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(Math.floor(score) + ' 秒', padding, padding);

            ctx.fillStyle = '#999';
            ctx.font = `${fontSize * 0.6}px Arial`;
            ctx.textAlign = 'right';
            ctx.textBaseline = 'top';
            ctx.fillText('最高: ' + bestScore + ' 秒', W - padding, padding);

            // 结束画面
            if (gameOver && score > 0) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, W, H);

                const cx = W / 2;
                const cy = H / 2;

                ctx.fillStyle = '#ff4444';
                ctx.font = `bold ${fontSize * 1.6}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('游戏结束', cx, cy - fontSize * 1.5);

                ctx.fillStyle = '#fff';
                ctx.font = `${fontSize * 0.9}px Arial`;
                ctx.fillText('坚持了 ' + Math.floor(score) + ' 秒', cx, cy - fontSize * 0.2);

                if (Math.floor(score) >= bestScore && bestScore > 0) {
                    ctx.fillStyle = '#ffcc00';
                    ctx.font = `bold ${fontSize * 0.8}px Arial`;
                    ctx.fillText('🏆 新纪录！', cx, cy + fontSize * 0.8);
                }

                ctx.fillStyle = '#aaa';
                ctx.font = `${fontSize * 0.6}px Arial`;
                const blink = 0.5 + 0.5 * Math.sin(Date.now() / 600);
                ctx.globalAlpha = blink;
                ctx.fillText('点击画面重新开始', cx, cy + fontSize * 1.8);
                ctx.globalAlpha = 1;
            }

            if (gameOver && score === 0) {
                const cx = W / 2;
                const cy = H / 2;

                ctx.fillStyle = '#fff';
                ctx.font = `bold ${fontSize * 1.2}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('弹幕躲避', cx, cy - fontSize);

                ctx.fillStyle = '#aaa';
                ctx.font = `${fontSize * 0.6}px Arial`;
                ctx.fillText('移动鼠标 / 滑动屏幕躲避彩色球', cx, cy + fontSize * 0.5);
                const blink = 0.5 + 0.5 * Math.sin(Date.now() / 600);
                ctx.globalAlpha = blink;
                ctx.fillText('点击开始游戏', cx, cy + fontSize * 1.5);
                ctx.globalAlpha = 1;
            }

            ctx.textBaseline = 'alphabetic';
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // 初始调用一次，确保 player.size 等有值
        W = window.innerWidth;
        H = window.innerHeight;
        player.size = Math.max(6, Math.min(W, H) * 0.015);
        mouseX = W / 2;
        mouseY = H / 2;

        gameLoop();
    </script>
</body>
</html>
