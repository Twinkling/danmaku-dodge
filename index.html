<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="使用鼠标、触摸或键盘躲避彩色弹幕球。">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2212%22%20fill=%22%230a0a0a%22/%3E%3Ccircle%20cx=%2245%22%20cy=%2219%22%20r=%229%22%20fill=%22%23ff4d7d%22/%3E%3Crect%20x=%2215%22%20y=%2233%22%20width=%2218%22%20height=%2218%22%20fill=%22%2300ddff%22/%3E%3C/svg%3E">
    <title>弹幕躲避</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: -webkit-fill-available;
            overflow: hidden;
            background: #0a0a0a;
            font-family: -apple-system, Arial, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            position: fixed;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        canvas:focus {
            outline: none;
        }

        canvas:focus-visible {
            outline: none;
            box-shadow: inset 0 0 0 2px #00ddff;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <p id="game-instructions" class="visually-hidden">使用鼠标、触摸、方向键或 WASD 躲避彩色弹幕球。按 Enter 或空格开始或重新开始游戏。</p>
    <p id="game-status" class="visually-hidden" aria-live="polite" aria-atomic="true">等待开始游戏</p>
    <canvas id="game" tabindex="0" role="application" aria-label="弹幕躲避游戏" aria-describedby="game-instructions game-status"></canvas>
    <script type="module" src="./src/game.js"></script>
</body>
</html>
